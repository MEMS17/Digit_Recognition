name: digit-recognition
services:
  front:
    build: ./front
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://back:8000
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back
  back:
    build: ./back
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-before-deployment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,back}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-postal_ocr}
      IA_SERVICE_URL: ${IA_SERVICE_URL:-http://ia:8001}
    volumes:
      - ./back:/app
    depends_on:
      mongo:
        condition: service_healthy
      ia:
        condition: service_started
  ia:
    build: ./ia
    expose:
      - "8001"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-postal_ocr}
    volumes:
      - ./ia:/app
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  mongo_data:
  front_node_modules:
